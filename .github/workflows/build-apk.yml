name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "GRADLE_FAILED=true" > ../gradle_error.flag
            tail -n 100 ../gradle_build.log > ../gradle_error.log
          }

      - name: Report and Push Log on Failure
        if: always()
        run: |
          if [ -f gradle_error.flag ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add gradle_error.log
            git commit -m "ci: capture gradle build error log [skip ci]" || true
            git push || true
            echo "--- GRADLE BUILD ERROR OUTPUT ---"
            cat gradle_error.log
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fokkofin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to download folder
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/app-debug.apk download/fokkofin.apk
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add download/fokkofin.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(apk): update native Android APK binary v2.0.0 [skip ci]" && git push)
